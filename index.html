<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Планер">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f1115'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%235b8cff' stroke-width='8'/%3E%3Cpath d='M36 50 l10 10 l20 -20' fill='none' stroke='%233ecf8e' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f1115'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%235b8cff' stroke-width='8'/%3E%3Cpath d='M36 50 l10 10 l20 -20' fill='none' stroke='%233ecf8e' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Планер</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --text:#e8eaf0; --muted:#8b93a7; --accent:#5b8cff; --good:#3ecf8e;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:20px 14px 60px}
  h1{font-size:22px;margin:0}
  .date{color:var(--muted);font-size:13.5px;margin-top:2px}
  .addrow{display:flex;gap:8px;margin:18px 0 14px}
  .inp{
    background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:11px 13px;border-radius:11px;font-size:15px;width:100%;font-family:inherit;
  }
  .inp:focus{outline:none;border-color:var(--accent)}
  .btn{
    background:var(--accent);border:none;color:#fff;font-size:14px;font-weight:600;
    padding:11px 16px;border-radius:11px;cursor:pointer;flex:0 0 auto;
  }
  .btn:active{filter:brightness(1.1)}
  .btn.ghost{background:var(--panel2);color:var(--muted);font-weight:400;font-size:13px;padding:8px 12px;border-radius:9px}
  .btn.ghost:active{color:var(--text)}
  .list{display:flex;flex-direction:column;gap:8px}
  .task{
    display:flex;align-items:center;gap:12px;
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:12px 14px;
  }
  .chk{
    width:24px;height:24px;flex:0 0 24px;border-radius:8px;border:2px solid var(--line);
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:transparent;font-size:15px;line-height:1;user-select:none;transition:.12s;
  }
  .chk.on{background:var(--good);border-color:var(--good);color:#08130d}
  .txt{flex:1;font-size:15px;min-width:0;word-break:break-word}
  .txt.done{color:var(--muted);text-decoration:line-through}
  .del{
    width:28px;height:28px;flex:0 0 28px;border-radius:8px;border:none;background:transparent;
    color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .del:active{background:#2a2f3a;color:var(--text)}
  .empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14.5px;border:1px dashed var(--line);border-radius:var(--radius)}
  .foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;color:var(--muted);font-size:13px}
  .foot b{color:var(--text);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div class="wrap">
  <h1>Планер</h1>
  <div class="date" id="date"></div>

  <div class="addrow">
    <input class="inp" id="inp" placeholder="Новая задача…" autocomplete="off">
    <button class="btn" id="add">Добавить</button>
  </div>

  <div class="list" id="list"></div>

  <div class="foot" id="foot" style="display:none">
    <span id="count"></span>
    <button class="btn ghost" id="clear">Убрать выполненные</button>
  </div>
</div>
<script>
const LS_KEY = "planner.v3";
let uid = 0;
const nid = () => "t" + Date.now().toString(36) + (uid++).toString(36);

const data = (() => {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if(raw){ const d = JSON.parse(raw); if(Array.isArray(d.tasks)) return d; }
  } catch(e){}
  return {tasks:[]};
})();
const save = () => localStorage.setItem(LS_KEY, JSON.stringify(data));

const $ = (s) => document.querySelector(s);
const WD = ["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const d = new Date();
$("#date").textContent = WD[d.getDay()] + ", " + d.getDate() + " " + MON[d.getMonth()];

function render(){
  const list = $("#list");
  list.innerHTML = "";
  if(!data.tasks.length){
    list.innerHTML = '<div class="empty">Задач пока нет.<br>Добавь первую — и поехали.</div>';
  }
  const open = data.tasks.filter(t=>!t.done);
  const done = data.tasks.filter(t=>t.done);
  open.concat(done).forEach(t => {
    const row = document.createElement("div");
    row.className = "task";

    const chk = document.createElement("div");
    chk.className = "chk" + (t.done ? " on" : "");
    chk.textContent = "✓";
    chk.onclick = () => { t.done = !t.done; save(); render(); };

    const txt = document.createElement("div");
    txt.className = "txt" + (t.done ? " done" : "");
    txt.textContent = t.text;

    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "Удалить";
    del.onclick = () => {
      data.tasks = data.tasks.filter(x => x.id !== t.id);
      save(); render();
    };

    row.appendChild(chk); row.appendChild(txt); row.appendChild(del);
    list.appendChild(row);
  });

  const foot = $("#foot");
  if(!data.tasks.length){ foot.style.display = "none"; return; }
  foot.style.display = "flex";
  $("#count").innerHTML = "Выполнено: <b>" + done.length + " из " + data.tasks.length + "</b>";
  $("#clear").style.display = done.length ? "" : "none";
}

function addTask(){
  const v = $("#inp").value.trim();
  if(!v) return;
  data.tasks.push({id:nid(), text:v, done:false});
  $("#inp").value = "";
  save(); render();
}

$("#add").onclick = addTask;
$("#inp").onkeydown = (e) => { if(e.key === "Enter") addTask(); };
$("#clear").onclick = () => {
  data.tasks = data.tasks.filter(t => !t.done);
  save(); render();
};

render();
</script>
</body>
</html>
